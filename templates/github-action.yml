# Copy this file into YOUR repo at .github/workflows/schemaproof.yml — it is not
# part of this repo's own CI (schemaproof's standing rule is no CI/CD on its own
# repo; this file is a template shipped inside the npm package for consumers).
#
# Runs `schemaproof check` against every changed .sql migration file in a pull
# request and posts (or updates) one PR comment with the real verdict, using
# this package's own `--pr-comment` markdown output — not a separate formatter.
#
# Requires a `DATABASE_URL` secret pointing at a real staging/preview Postgres
# (Supabase, Neon, or plain Postgres) for the live-stats-aware verdict. Without
# it, SchemaProof still runs — just in static-only mode (same tier as Squawk).
name: SchemaProof

on:
  pull_request:
    paths:
      - "**/*.sql"

permissions:
  contents: read
  pull-requests: write

jobs:
  schemaproof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed .sql files
        id: changed
        run: |
          git diff --name-only --diff-filter=AM "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
            | grep '\.sql$' > changed_sql_files.txt || true
          echo "count=$(wc -l < changed_sql_files.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Run schemaproof check on each changed file
        if: steps.changed.outputs.count != '0'
        id: schemaproof
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          : > report.md
          while read -r f; do
            [ -z "$f" ] && continue
            npx --yes schemaproof check "$f" ${DATABASE_URL:+--db "$DATABASE_URL"} --pr-comment >> report.md || true
            echo "" >> report.md
          done < changed_sql_files.txt
          {
            echo "report<<SCHEMAPROOF_EOF"
            cat report.md
            echo "SCHEMAPROOF_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post or update PR comment
        if: steps.changed.outputs.count != '0'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-tag: schemaproof
          edit-mode: replace
          body: ${{ steps.schemaproof.outputs.report }}

      - name: Fail the job if any statement was a real BLOCK
        if: steps.changed.outputs.count != '0'
        run: |
          if grep -q '🛑 BLOCK' report.md; then
            echo "SchemaProof found a BLOCK-severity migration risk — see the PR comment."
            exit 1
          fi
